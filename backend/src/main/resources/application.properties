quarkus.application.name=vps-backend
quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${VPS_WEB_ORIGIN:http://localhost:5173}
# Upload de vídeo direto pelo painel
quarkus.http.limits.max-body-size=${VPS_MAX_UPLOAD:300M}
quarkus.http.body.uploads-directory=${java.io.tmpdir}/vps-uploads

# Banco
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:vps}
quarkus.datasource.password=${DB_PASSWORD:vps}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/vps}
quarkus.datasource.devservices.enabled=false
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.mapping.format.global=ignore

# JobRunr (filas no Postgres)
quarkus.jobrunr.background-job-server.enabled=${JOBS_WORKER_ENABLED:true}
quarkus.jobrunr.background-job-server.worker-count=${VPS_JOB_WORKERS:4}
quarkus.jobrunr.dashboard.enabled=false

# Geral
vps.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
vps.storage.dir=${STORAGE_DIR:./data/media}
# Senha única do painel (sem login). Vazia = painel aberto (apenas para desenvolvimento local).
vps.admin-password=${VPS_ADMIN_PASSWORD:}
# Chave HMAC das URLs assinadas de mídia. Gere com: openssl rand -base64 32
vps.signing-key=${VPS_SIGNING_KEY:dev-only-signing-key-troque-em-producao}
# Vídeos e quadros ficam disponíveis para o modo manual por este tempo e depois são apagados
vps.media.retention=${VPS_MEDIA_RETENTION:24h}

# Provedores: IA = gemini | deepseek ; busca = serpapi | brave | deepseek
vps.ai.provider=${VPS_AI_PROVIDER:gemini}
vps.search.provider=${VPS_SEARCH_PROVIDER:serpapi}

# "deepseek" fala com qualquer endpoint /chat/completions no formato da OpenAI: a API oficial ou outro provedor
# que sirva o modelo (OpenRouter, Together, Fireworks, Azure, vLLM, Ollama...). A URL é a parte antes de /chat/completions.
vps.ai.deepseek-base-url=${VPS_AI_DEEPSEEK_BASE_URL:https://api.deepseek.com}
vps.ai.deepseek-model=${VPS_AI_DEEPSEEK_MODEL:deepseek-flash}
# A busca pode ir para outro provedor; vazio herda da análise. A chave da análise só é reaproveitada no mesmo host.
vps.search.deepseek-base-url=${VPS_SEARCH_DEEPSEEK_BASE_URL:}
vps.search.deepseek-model=${VPS_SEARCH_DEEPSEEK_MODEL:}

# Download de vídeo por URL (yt-dlp, processo isolado)
vps.download.ytdlp-bin=${VPS_YTDLP_BIN:yt-dlp}
vps.download.allowed-domains=${VPS_ALLOWED_DOMAINS:tiktok.com,youtube.com,youtu.be,instagram.com,facebook.com,fb.watch,x.com,twitter.com,kwai.com,pinterest.com,pin.it,vimeo.com}
vps.download.max-duration=${VPS_MAX_DURATION_SECONDS:900}
vps.download.max-bytes=${VPS_MAX_DOWNLOAD_BYTES:314572800}
vps.download.timeout=${VPS_DOWNLOAD_TIMEOUT:240s}

# Varredura do vídeo inteiro (CPU)
vps.scan.sample-fps=${VPS_SCAN_FPS:2}
vps.scan.max-frames=${VPS_SCAN_MAX_FRAMES:60}
vps.scan.seconds-per-frame=${VPS_SCAN_SECONDS_PER_FRAME:2.5}
vps.scan.batch-size=${VPS_SCAN_BATCH_SIZE:8}
vps.scan.parallel-batches=${VPS_SCAN_PARALLEL_BATCHES:3}
vps.scan.max-products=${VPS_MAX_PRODUCTS:25}

# Transcrição em CPU (whisper.cpp). Sem binário ou modelo, a fala só é usada pelo Gemini.
vps.whisper.bin=${VPS_WHISPER_BIN:whisper-cli}
vps.whisper.model=${VPS_WHISPER_MODEL:}
vps.whisper.language=${VPS_WHISPER_LANGUAGE:pt}
vps.whisper.threads=${VPS_WHISPER_THREADS:4}

quarkus.smallrye-openapi.info-title=Video Product Searcher API

# Segredos vêm de variáveis de ambiente (nomes padrão do Quarkus):
#   VPS_AI_GEMINI_API_KEY, VPS_AI_DEEPSEEK_API_KEY, VPS_SEARCH_DEEPSEEK_API_KEY, VPS_SEARCH_SERPAPI_KEY, VPS_SEARCH_BRAVE_KEY
